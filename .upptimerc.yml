# AKIN Travel public status page — https://status.akintravel.com
# Runbook: https://github.com/akin-travel/akin-online/blob/develop/docs/runbooks/status-page.md
# (akin-travel/issues#1675). This repo is public: never add a URL that carries a key or a token.
owner: akin-travel
repo: status

sites:
  - name: API
    url: https://api.akintravel.com/health
    expectedStatusCodes:
      - 200
  - name: Website
    url: https://akintravel.com/en
    expectedStatusCodes:
      - 200
  - name: Dashboard
    url: https://admin.akintravel.com/en/login
    expectedStatusCodes:
      - 200
  - name: White-label
    url: https://drifter.akintravel.com/en/login
    expectedStatusCodes:
      - 200
  - name: Sandbox API
    url: https://sandbox.akintravel.com/health
    expectedStatusCodes:
      - 200

status-website:
  cname: status.akintravel.com
  logoUrl: https://raw.githubusercontent.com/akin-travel/status/master/assets/akin-logo-mark.svg
  favicon: https://raw.githubusercontent.com/akin-travel/status/master/assets/akin-logo-mark.svg
  name: AKIN Travel status
  introTitle: "**AKIN Travel** platform status"
  introMessage: Live status of the AKIN Travel API, website, dashboard, partner sites and sandbox. Each check runs every 5 minutes from outside our own infrastructure.
  navbar:
    - title: Status
      href: /
    - title: Developer docs
      href: https://developers.akintravel.com
